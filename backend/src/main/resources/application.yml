server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: edupulse-server
  config:
    import: "optional:application-local.yml"
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:edupulse}}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:${MYSQLUSER:edupulse}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQLPASSWORD:edupulse}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    secret: ${JWT_SECRET:EduPulseSuperSecretKeyForJwtTokenGeneration2026SecureKeyMustBeLongEnough}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CLIENT_URL:http://localhost:5173}

mail:
  dry-run: ${MAIL_DRY_RUN:false}
  allow-demo-accounts: ${MAIL_ALLOW_DEMO:true}

edupulse:
  summary:
    cron: "${SUMMARY_CRON:0 0 6 * * MON}"
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8001}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}

ollama:
  url: ${OLLAMA_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
